<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e2e" />
      <stop offset="50%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="12" />
  
  <!-- Subtle Inner Ring Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(225, 6, 0, 0.25)" stroke-width="4" />

  <!-- Background Ambient Glow behind V -->
  <circle cx="256" cy="270" r="140" fill="#e10600" opacity="0.28" filter="url(#glow)" />

  <!-- Modern Geometric Luxury "V" Monogram -->
  <g filter="url(#glow)">
    <!-- Left Wing of V -->
    <path d="M116 138 L204 138 L256 320 L212 320 Z" fill="url(#accentGrad)" />
    <!-- Main Solid Bold V -->
    <path d="M116 138 L196 138 L256 362 L316 138 L396 138 L290 412 L222 412 Z" fill="url(#vGrad)" />
    <!-- Dynamic Forward Accent Slash -->
    <polygon points="320,138 396,138 300,340 264,340" fill="url(#vGrad)" opacity="0.95" />
    <!-- Top-right energetic dot / spark -->
    <circle cx="396" cy="120" r="14" fill="#ff2e2e" />
  </g>
</svg>
